# Place this file at: .github/workflows/kibot.yml (in the repository root)
name: KiBot

on:
  push:
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - '**.kicad_pro'
      - '**.kicad_dru'            # custom design rules      
      - '**/sym-lib-table'
      - '**/fp-lib-table'
      - '**.kibot.yaml'
      - '.gitmodules'
      - 'kicad/libs/**'           # submodule pointer updates
      - '.github/workflows/kibot.yml'
  pull_request:
  workflow_dispatch:        # allows a manual run from the Actions tab

jobs:
  kibot:
    runs-on: ubuntu-latest
    env:
      # the KiBot container sees the workspace at /github/workspace
      #JLCPCB_LIB: /github/workspace/.ci/jlcpcb
      JLCPCB_LIB: /github/workspace/.ci/jlcpcb/footprints
      SKICAD_LIB: /github/workspace/kicad/libs/SKICadLib/
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # only needed if your libraries are submodules
          token: ${{ secrets.LIB_TOKEN }}


      - name: Get JLCPCB library
        uses: actions/checkout@v6
        with:
          repository: CDFER/JLCPCB-Kicad-Library   # use the repo from step 1
          path: .ci/jlcpcb
          # ref: <tag or commit>   # optional: pin a version for reproducible builds

      #- name: Debug library paths
      #  run: |
      #    find .ci/jlcpcb -name "*.pretty" -type d
      #    cat KiCad/fp-lib-table     # use your real project path


      - name: Debug SLib paths
        run: |
          echo "=== KiCad project files ==="
          find . -name "*.kicad_pro" -not -path "./.ci/*"
          echo
          echo "=== Submodule status ==="
          git submodule status
          echo
          echo "=== Symbol libraries (.kicad_sym) in submodule ==="
          find kicad/libs/SKICadLib -name "*.kicad_sym"
          echo
          echo "=== Footprint libraries (.pretty) in submodule ==="
          find kicad/libs/SKICadLib -name "*.pretty" -type d
          echo
          echo "=== Project library tables ==="
          for f in $(find . -name "sym-lib-table" -o -name "fp-lib-table" | grep -v "^./.ci/"); do
            echo "--- $f"; cat "$f"; echo
          done
          echo
          echo "=== Path variables in CI ==="
          echo "SKICAD_LIB=${SKICAD_LIB:-<not set>}"
          echo "JLCPCB_LIB=${JLCPCB_LIB:-<not set>}"


      - name: Run KiBot
        # v2_k10 = KiCad 10 with the latest stable KiBot.
        # (v2_dk10 = KiCad 10 with the KiBot development version)
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          # All paths are relative to the repository root.
          config: kicad/config.kibot.yaml
          schema: kicad/Weihnachtsbaum.kicad_sch   # top-level sheet
          board:  kicad/Weihnachtsbaum.kicad_pcb
          dir: output

      - name: Upload outputs
        if: always()              # also upload reports when ERC/DRC fail
        uses: actions/upload-artifact@v6
        with:
          name: kibot-outputs
          path: output
          retention-days: 14
