# Place this file at: .github/workflows/kibot.yml (in the repository root)
name: KiBot

on:
  push:
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - '**.kicad_pro'
      - '**.kibot.yaml'
      - '.github/workflows/kibot.yml'
  pull_request:
  workflow_dispatch:        # allows a manual run from the Actions tab

jobs:
  kibot:
    runs-on: ubuntu-latest
    env:
      # the KiBot container sees the workspace at /github/workspace
      JLCPCB_LIB: /github/workspace/.ci/jlcpcb
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # only needed if your libraries are submodules
          token: ${{ secrets.LIB_TOKEN }}


      - name: Get JLCPCB library
        uses: actions/checkout@v6
        with:
          repository: CDFER/JLCPCB-Kicad-Library   # use the repo from step 1
          path: .ci/jlcpcb
          # ref: <tag or commit>   # optional: pin a version for reproducible builds

      - name: Debug library paths
        run: |
          find .ci/jlcpcb -name "*.pretty" -type d
          cat KiCad/fp-lib-table     # use your real project path

      - name: Run KiBot
        # v2_k10 = KiCad 10 with the latest stable KiBot.
        # (v2_dk10 = KiCad 10 with the KiBot development version)
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          # All paths are relative to the repository root.
          config: KiCad/config.kibot.yaml
          schema: KiCad/Weihnachtsbaum.kicad_sch   # top-level sheet
          board:  KiCad/Weihnachtsbaum.kicad_pcb
          dir: output

      - name: Upload outputs
        if: always()              # also upload reports when ERC/DRC fail
        uses: actions/upload-artifact@v6
        with:
          name: kibot-outputs
          path: output
          retention-days: 14
